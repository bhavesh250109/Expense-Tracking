<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101113">
<meta name="description" content="A minimal Smoky Obsidian personal expense tracker.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Obsidian — Expense Tracker</title>
<style>
:root{color-scheme:dark;--bg:#101113;--panel:#1c1d21;--panel2:#222329;--line:#383940;--text:#f0f0f2;--muted:#999ba4;--silver:#b8b8c3;--red:#e2b6b6;--green:#c9d6cc}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#34353d 0%,#17181c 38%,var(--bg) 75%);color:var(--text);font:15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
button,input,select{font:inherit}button{cursor:pointer}.app{max-width:760px;margin:auto;padding:22px 16px 40px}.top{display:flex;justify-content:space-between;align-items:center;margin:8px 0 20px}.eyebrow{font-size:11px;letter-spacing:.16em;color:var(--muted);font-weight:700}.brand{font-size:27px;font-weight:720;letter-spacing:-.04em;margin:7px 0 3px}.sub{color:var(--muted);font-size:13px}.orb{width:46px;height:46px;border:1px solid #41424a;border-radius:16px;background:linear-gradient(145deg,#363740,#1c1d21);display:grid;place-items:center;font-size:21px}
.hero{background:linear-gradient(145deg,#292a30,#1b1c20 65%,#24252b);border:1px solid #3a3b43;border-radius:22px;padding:20px;margin-bottom:17px;box-shadow:0 18px 45px #0005}.hero-label{font-size:11px;letter-spacing:.12em;color:#a1a2ab}.big{font-size:35px;font-weight:750;letter-spacing:-.04em;margin:7px 0 13px}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:12px}.statlabel{font-size:11px;color:var(--muted)}.stat{font-size:19px;font-weight:680;margin-top:3px}.rule{height:1px;background:var(--line);margin:15px 0}.bar{height:8px;background:#414249;border-radius:20px;overflow:hidden}.bar>i{display:block;height:100%;background:linear-gradient(90deg,#777985,#d0d0d9);border-radius:20px;width:0}
nav{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;background:#191a1e;border:1px solid #303138;padding:5px;border-radius:14px;margin:17px 0}nav button{border:0;border-radius:10px;padding:10px 3px;background:transparent;color:var(--muted);font-size:12px}nav button.active{background:#414249;color:white}
.section-title{font-size:16px;font-weight:700;margin:18px 0 11px}.card{background:linear-gradient(145deg,#222329,#1a1b1f);border:1px solid #34353c;border-radius:17px;padding:15px;margin:10px 0}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.grow{flex:1;min-width:0}.muted{color:var(--muted)}.small{font-size:12px}.catrow{margin:13px 0}.catrow .bar{height:6px;margin-top:7px}.catrow .bar i{background:#b2b2bd}
input,select{width:100%;background:#141519;border:1px solid #41424a;border-radius:11px;color:var(--text);padding:12px;outline:none}input:focus,select:focus{border-color:#a4a5b0}label{display:block;color:#b5b5bf;font-size:12px;margin:10px 0 6px}
.btn{border:1px solid #555660;background:linear-gradient(145deg,#d0d0d8,#9697a2);color:#15161a;border-radius:12px;padding:12px 15px;font-weight:700}.btn.secondary{background:#292a30;color:#eee;border-color:#44454d}.btn.ghost{background:transparent;color:#c7c7d0}.btn.full{width:100%;margin-top:10px}.btn:disabled{opacity:.45;cursor:not-allowed}
.filters{display:flex;gap:7px;overflow:auto;margin:10px 0}.chip{white-space:nowrap;background:#25262b;border:1px solid #41424a;border-radius:30px;color:#bbb;padding:8px 12px;font-size:12px}.chip.active{background:#d0d0d8;color:#17181b}
.tx{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid #34353a}.tx:last-child{border:0}.txicon{width:39px;height:39px;border-radius:13px;background:#303138;display:grid;place-items:center}.txname{font-weight:620}.amount{font-weight:700;color:var(--red);white-space:nowrap}.delete{border:0;background:none;color:#92939d;padding:5px;font-size:12px}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.dayname{text-align:center;color:#8f9099;font-size:11px;padding:7px 0}.day{min-height:42px;border:1px solid #34353b;background:#25262b;border-radius:9px;color:#eee;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}.day.has{border-color:#777984;background:#3b3c44}.dot{width:4px;height:4px;border-radius:50%;background:#ddd}
.empty{text-align:center;color:var(--muted);padding:25px 8px;font-size:13px}.modal{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;padding:12px;z-index:4}.modal.open{display:flex}.sheet{width:min(100%,560px);background:#202126;border:1px solid #4a4b53;border-radius:22px;padding:19px;max-height:90vh;overflow:auto;box-shadow:0 20px 80px #0009}.sheethead{display:flex;justify-content:space-between;align-items:center;font-weight:750;font-size:18px}.x{border:0;background:#34353c;color:white;border-radius:9px;padding:7px 11px}
footer{text-align:center;color:#777983;font-size:10px;letter-spacing:.12em;margin:24px 0 5px}.tools{display:flex;gap:8px;flex-wrap:wrap}.tools button{flex:1}
canvas{width:100%;height:190px;display:block}.notice{font-size:12px;color:#aeb0b9;line-height:1.5}
@media(min-width:600px){.app{padding:30px 24px}.modal{align-items:center}.brand{font-size:31px}}
</style>
</head>
<body>
<main class="app">
<header class="top"><div><div class="eyebrow">◉ &nbsp; OBSIDIAN / FINANCE</div><div class="brand">Expense tracker.</div><div class="sub">Your money, your awareness.</div></div><div class="orb">◒</div></header>
<section class="hero">
<div class="row between"><span class="hero-label" id="monthLabel">TOTAL SPENDING · THIS MONTH</span><span class="eyebrow">INR ₹</span></div>
<div class="big" id="total">₹0</div><div class="rule"></div>
<div class="twocol"><div><div class="statlabel">Monthly budget</div><div class="stat" id="budgetText">₹5,000</div></div><div style="text-align:right"><div class="statlabel">Remaining</div><div class="stat" id="remaining">₹5,000</div></div></div>
<div class="bar" style="margin-top:13px"><i id="budgetBar"></i></div><div class="small muted" style="margin-top:7px" id="budgetPct">0% of budget used</div>
</section>
<nav><button class="active" data-tab="overview">Overview</button><button data-tab="history">History</button><button data-tab="calendar">Calendar</button><button data-tab="insights">Insights</button></nav>
<section id="view"></section>
<footer>OBSIDIAN · EXPENSE EDITION &nbsp; / &nbsp; SMOKE 02</footer>
</main>
<div class="modal" id="modal"><div class="sheet">
<div class="sheethead"><span>New expense</span><button class="x" id="closeModal">✕</button></div>
<form id="expenseForm">
<label for="amount">Amount (₹)</label><input id="amount" type="number" min="0.01" step="0.01" placeholder="Enter amount" required>
<label for="description">Description</label><input id="description" maxlength="80" placeholder="e.g. Lunch">
<label for="category">Category</label><select id="category"></select>
<label for="date">Date</label><input id="date" type="date" required>
<button class="btn full" type="submit">Save expense</button>
</form></div></div>
<script>
const CATS=["Food","Travel","Shopping","Education","Entertainment","Bills","Health","Other"];
const KEY="obsidian-expenses-v1", PREF="obsidian-preferences-v1";
let tx=[],prefs={budget:5000,month:new Date().toISOString().slice(0,7)},tab="overview",filter="All";
const $=id=>document.getElementById(id), money=n=>new Intl.NumberFormat("en-IN",{style:"currency",currency:"INR",maximumFractionDigits:2}).format(n);
function load(){try{tx=JSON.parse(localStorage.getItem(KEY)||"[]");prefs={...prefs,...JSON.parse(localStorage.getItem(PREF)||"{}")};}catch(e){tx=[];}}
function save(){localStorage.setItem(KEY,JSON.stringify(tx));localStorage.setItem(PREF,JSON.stringify(prefs));}
function monthData(){return tx.filter(t=>t.date.startsWith(prefs.month))}
function sum(a){return a.reduce((s,t)=>s+t.amount,0)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function header(){const d=new Date(prefs.month+"-01T12:00:00");$("monthLabel").textContent="TOTAL SPENDING · "+d.toLocaleDateString("en-IN",{month:"long",year:"numeric"}).toUpperCase();let total=sum(monthData()),rem=Number(prefs.budget)-total,pct=Number(prefs.budget)>0?total/Number(prefs.budget)*100:0;$("total").textContent=money(total);$("budgetText").textContent=money(Number(prefs.budget));$("remaining").textContent=money(rem);$("remaining").style.color=rem<0?"#e5a5a5":"#c9d6cc";$("budgetBar").style.width=Math.min(100,pct)+"%";$("budgetPct").textContent=Math.round(pct)+"% of budget used";}
function txHTML(t){return `<div class="tx"><div class="txicon">◈</div><div class="grow"><div class="txname">${esc(t.description||t.category)}</div><div class="small muted">${esc(t.category)} · ${esc(t.date)}</div></div><div class="amount">${money(t.amount)}</div><button class="delete" data-delete="${t.id}" aria-label="Delete expense">Delete</button></div>`}
function setMonthInput(){return `<label>Selected month</label><input type="month" id="monthInput" value="${esc(prefs.month)}">`}
function overview(){let a=monthData(),cats=CATS.map(c=>({name:c,value:sum(a.filter(t=>t.category===c))})).filter(x=>x.value);let max=Math.max(1,...cats.map(c=>c.value));return `${setMonthInput()}<div class="section-title">Where your money goes</div><div class="card">${cats.length?cats.map(c=>`<div class="catrow"><div class="row between"><span>${c.name}</span><b>${money(c.value)}</b></div><div class="bar"><i style="width:${c.value/max*100}%"></i></div></div>`).join(""):'<div class="empty">No expenses recorded this month yet.</div>'}</div><div class="row between"><div class="section-title">Recent expenses</div><button class="btn secondary" id="addBtn">＋ Add expense</button></div><div class="card">${a.slice().sort((x,y)=>y.date.localeCompare(x.date)||y.id-x.id).slice(0,5).map(txHTML).join("")||'<div class="empty">Your first expense goes here.</div>'}</div><div class="card"><div class="section-title" style="margin-top:0">Monthly budget</div><label for="budgetInput">Set spending limit (₹)</label><input type="number" id="budgetInput" min="0" step="1" value="${Number(prefs.budget)}"><p class="notice">Your budget is a personal spending target, not an income calculation.</p></div>`}
function history(){let a=monthData().filter(t=>filter==="All"||t.category===filter).sort((x,y)=>y.date.localeCompare(x.date)||y.id-x.id);return `${setMonthInput()}<div class="filters">${["All",...CATS].map(c=>`<button class="chip ${filter===c?"active":""}" data-filter="${c}">${c}</button>`).join("")}</div><div class="card">${a.map(txHTML).join("")||'<div class="empty">No expenses found for this selection.</div>'}</div><button class="btn full" id="addBtn">＋ Add expense</button>`}
function calendar(){let [y,m]=prefs.month.split("-").map(Number),first=(new Date(y,m-1,1).getDay()+6)%7,days=new Date(y,m,0).getDate(),a=monthData();let cells=Array(first).fill('<div></div>');for(let d=1;d<=days;d++){let ds=`${prefs.month}-${String(d).padStart(2,"0")}`,has=a.some(t=>t.date===ds);cells.push(`<button class="day ${has?"has":""}" data-day="${ds}">${d}${has?'<i class="dot"></i>':""}</button>`)}return `${setMonthInput()}<div class="card"><div class="calendar">${["M","T","W","T","F","S","S"].map(x=>`<div class="dayname">${x}</div>`).join("")}${cells.join("")}</div></div><div class="section-title">Daily expense records</div><div class="card" id="dayDetails"><div class="empty">Tap a date to see its expenses.</div></div>`}
function insights(){let a=monthData(),total=sum(a),cats=CATS.map(c=>({name:c,value:sum(a.filter(t=>t.category===c))})).filter(c=>c.value);let avg=a.length?total/a.length:0;return `${setMonthInput()}<div class="card"><div class="statlabel">TOTAL SPENT THIS MONTH</div><div class="big">${money(total)}</div><div class="small muted">${a.length} recorded transactions</div></div><div class="section-title">Category breakdown</div><div class="card">${cats.length?cats.map(c=>`<div class="catrow"><div class="row between"><span>${c.name}</span><b>${money(c.value)} · ${Math.round(c.value/total*100)}%</b></div><div class="bar"><i style="width:${c.value/Math.max(1,...cats.map(x=>x.value))*100}%"></i></div></div>`).join(""):'<div class="empty">Add expenses to generate statistics.</div>'}</div><div class="card"><div class="statlabel">AVERAGE PER TRANSACTION</div><div class="stat" style="font-size:25px">${money(avg)}</div></div><div class="section-title">Spending by category</div><div class="card"><canvas id="chart" width="640" height="220"></canvas></div><div class="section-title">Data backup</div><div class="card"><p class="notice">Your records stay on this device. Export a backup regularly so you can restore them if you change phones or clear browser data.</p><div class="tools"><button class="btn secondary" id="exportBtn">Export backup</button><button class="btn secondary" id="importBtn">Import backup</button></div><input id="importFile" type="file" accept="application/json,.json" style="display:none"></div>`}
function render(){header();document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));$("view").innerHTML=tab==="overview"?overview():tab==="history"?history():tab==="calendar"?calendar():insights();let mi=$("monthInput");if(mi)mi.addEventListener("change",e=>{prefs.month=e.target.value||prefs.month;save();render()});let bi=$("budgetInput");if(bi)bi.addEventListener("change",e=>{prefs.budget=Math.max(0,Number(e.target.value)||0);save();header()});let ab=$("addBtn");if(ab)ab.onclick=openModal;document.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});document.querySelectorAll("[data-delete]").forEach(b=>b.onclick=()=>{if(confirm("Delete this expense?")){tx=tx.filter(t=>t.id!==Number(b.dataset.delete));save();render()}});document.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>showDay(b.dataset.day));if(tab==="insights"){drawChart();let ex=$("exportBtn"),im=$("importBtn"),file=$("importFile");if(ex)ex.onclick=()=>{let blob=new Blob([JSON.stringify({app:"Obsidian Expense Tracker",version:1,transactions:tx,preferences:prefs},null,2)],{type:"application/json"});let url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="obsidian-expense-backup-"+new Date().toISOString().slice(0,10)+".json";a.click();URL.revokeObjectURL(url)};if(im)im.onclick=()=>file.click();if(file)file.onchange=async()=>{let f=file.files[0];if(!f)return;try{let data=JSON.parse(await f.text());if(!Array.isArray(data.transactions))throw Error("Invalid backup");if(confirm("Replace current records with "+data.transactions.length+" backed-up transactions?")){tx=data.transactions.filter(t=>t&&Number(t.amount)>0&&t.date&&t.category);prefs={...prefs,...(data.preferences||{})};save();render();alert("Backup restored.")}}catch(e){alert("That backup file could not be read.")}file.value=""}}}
function showDay(ds){let a=monthData().filter(t=>t.date===ds);$("dayDetails").innerHTML=`<b>${ds}</b>${a.length?a.map(txHTML).join(""):'<div class="empty">No expenses on this date.</div>'}`;$("dayDetails").querySelectorAll("[data-delete]").forEach(b=>b.onclick=()=>{tx=tx.filter(t=>t.id!==Number(b.dataset.delete));save();render()})}
function drawChart(){let c=$("chart");if(!c)return;let ctx=c.getContext("2d"),a=CATS.map(n=>({n,v:sum(monthData().filter(t=>t.category===n))})).filter(x=>x.v);ctx.clearRect(0,0,c.width,c.height);if(!a.length){ctx.fillStyle="#999ba4";ctx.font="16px system-ui";ctx.fillText("No data yet",20,40);return}let max=Math.max(...a.map(x=>x.v));let gap=18,w=(c.width-40-gap*(a.length-1))/a.length;a.forEach((x,i)=>{let h=x.v/max*145,xx=20+i*(w+gap);ctx.fillStyle="#b8b8c3";ctx.beginPath();ctx.roundRect(xx,160-h,w,h,7);ctx.fill();ctx.fillStyle="#a4a5ad";ctx.font="11px system-ui";ctx.textAlign="center";ctx.fillText(x.n.slice(0,8),xx+w/2,184);ctx.fillStyle="#eee";ctx.fillText(money(x.v).replace("₹","₹"),xx+w/2,Math.max(12,150-h));});}
function openModal(){$("modal").classList.add("open");$("date").value=new Date().toISOString().slice(0,10);$("amount").focus()}
function closeModal(){$("modal").classList.remove("open")}
$("category").innerHTML=CATS.map(c=>`<option>${c}</option>`).join("");
$("expenseForm").addEventListener("submit",e=>{e.preventDefault();let amount=Number($("amount").value);if(!(amount>0))return;tx.push({id:Date.now(),amount,description:$("description").value.trim(),category:$("category").value,date:$("date").value});save();closeModal();render()});
$("closeModal").onclick=closeModal;$("modal").addEventListener("click",e=>{if(e.target===$("modal"))closeModal()});
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
load();render();
if("serviceWorker" in navigator && location.protocol.startsWith("http"))navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script>
</body></html>
